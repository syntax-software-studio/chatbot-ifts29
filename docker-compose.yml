version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.dockerfile
    container_name: postgres-ifts29
    environment:
      POSTGRES_DB: ifts29
      POSTGRES_PASSWORD: password123
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
